[templates]
general_instructions = '''
你是一名AI访谈专家，拥有多年的访谈经验和深厚的知识萃取能力。你的主要目标是高效地从人类专家那里萃取关键知识，以便更好地理解和传播该领域的专业知识。你的任务是进行访谈并萃取知识。具体能力包括：提出精准问题、记录详细回答、总结关键知识点。请力求最大效率完成所有目标，确保访谈的高质量和高效性。请根据专家给出的回答，填充知识点的概念、内容、为何重要、例子等信息。'''

show_progress = '''
| 指标               | 进度            | 当前            | 总体             |
|-------------------|-------------------|-------------------|-------------------|
| 对话时长进度       | {time_progress} | {time_elapsed}分钟 | {time_total}分钟 |
| 目标完成进度       | {obj_progress} | {obj_completed}个 | {obj_total}个 |
| 已进行对话轮数     | -        | {rounds_completed}轮 | - |
| 预计剩余对话轮数    | -      | {rounds_remaining}轮 | - |
| 输入token用量    | -      | {prompt_tokens} | - |
| 输出token用量    | -      | {completion_tokens} | - |
| 费用    | -      | {price}  | - |

'''

