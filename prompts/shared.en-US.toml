### The structure of the knowledge tree is as follows
```json
{{
  "id": "<This is the id of this extraction task, the id of each task is Unique>",
  "domain": "<This is the domain involved in this task>",
  "name": "<This is the name of this task>",
  "task_description": "<This is a description of this task, involving an overview of the background information of human experts, and the overall goal you need to achieve>",
  "objectives": [
    {{
      "id": "<This is the id of this Objective, the id of each Objective is Unique>",
      "obj_description": "<This is a description of this Objective, please extract the expert within the scope of this description>",
      "knowledge": "[<List of knowledge nodes already extracted, all knowledge you analyze must be added to the corresponding knowledge nodes>]",
      "progress": "<This is the completion progress of this Objective, which changes according to the quantity and quality of extracted knowledge>",
      "complete": "<This is whether this Objective is completed. If completed, you no longer need to ask questions about this Objective>"
    }}
    ]
}}
```

### The structure of each knowledge node is as follows
```json
    {{
      "id": "<This is the knowledge point id, the id of each knowledge point is Unique>",
      "concept": "<This is the definition and concept of knowledge, generally an abstract description of knowledge>",
      "why_important": "<This describes why this knowledge is important, what application scenarios it can be used in, what value it can bring, etc.>",
      "knowledge_description": "<This is the main content and framework of knowledge, descriptive content of the knowledge itself>",
      "example": "<This is a case related to this knowledge, which can support its value or demonstrate how to use it, etc.>",
      "other": "[<Here is a List of other contents related to this knowledge, such as associations with other knowledge points, etc.>]",
      "sub_knowledge": "[<Here is a List of sub-knowledge nodes, which can nest other knowledge nodes>]"
    }}
```

### The Actions you can execute are as follows.
```json
{{
  "action": "add_new_knowledge_node",
"description": "<Indicates that a new knowledge point has been newly discovered under a certain Objective or Knowledge, and needs to be added under the corresponding node. You must add the concept type.>",
  "arguments": {{
    "parent_id": {{
      "type": "<str, parent_id must exists>",
"description": "<This is the target Objective or Knowledge node ID to be updated, and a Knowledge node will be added under this node>"
    }},
    "knowledge_detail": {{
      "type": "<Dict. Key is enum of string, one of \"example\" | \"knowledge_description\" | \"why important\" | \"concept\" | \"other\", concept must be provided. Value is str, the content of the type of knowledge>",
"key description": "<Used to indicate the type of extracted knowledge, concept is the definition and concept of knowledge, generally an abstract description of knowledge, why_important describes why this knowledge is important, what application scenarios it can be used in, what value it can bring, etc., knowledge_description is the main content and framework of knowledge, descriptive content of the knowledge itself, example is a case related to the knowledge, which can support its value or demonstrate how to use it, etc., other is a List of other contents related to the knowledge, such as associations with other knowledge points, etc. concept must be provided, otherwise it is unknown what this knowledge node is about after creation>",
"value description": "<Put the specific content of the knowledge here>"
    }}
  }}
}}
```

